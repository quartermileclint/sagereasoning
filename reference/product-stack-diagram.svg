<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowNavy" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16284d"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c9a227"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="920" height="700" fill="#ffffff"/>

  <!-- title -->
  <text x="460" y="42" text-anchor="middle" font-size="25" font-weight="bold" fill="#16284d">SageReasoning — Product Stack &amp; Vocabulary</text>
  <text x="460" y="68" text-anchor="middle" font-size="14" fill="#5b6b86">All three products are API services. The labels show what each one is, who uses it, and how it's delivered.</text>

  <!-- AI AGENT box -->
  <rect x="270" y="92" width="380" height="74" rx="10" fill="#1f3a6b" stroke="#c9a227" stroke-width="2"/>
  <text x="460" y="123" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">AI AGENT  ·  your customer</text>
  <text x="460" y="146" text-anchor="middle" font-size="12.5" fill="#e7d8a3">acts on its own and calls your services through its own wrapper code</text>

  <!-- wrapper pill -->
  <rect x="640" y="118" width="150" height="26" rx="13" fill="#f5f1e6" stroke="#c9a227" stroke-width="1.5"/>
  <text x="715" y="135" text-anchor="middle" font-size="11" fill="#16284d">wrapper = its calling code</text>

  <!-- arrow down: agent -> pipeline -->
  <line x1="460" y1="166" x2="460" y2="222" stroke="#16284d" stroke-width="2.5" marker-end="url(#arrowNavy)"/>
  <text x="476" y="198" font-size="12.5" font-style="italic" fill="#5b6b86">calls over the internet (API)</text>

  <!-- Sage Calling box -->
  <rect x="95" y="230" width="320" height="128" rx="10" fill="#f5f1e6" stroke="#16284d" stroke-width="2"/>
  <text x="255" y="262" text-anchor="middle" font-size="19" font-weight="bold" fill="#16284d">Sage Calling</text>
  <text x="255" y="284" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#9a7d1c">Purpose-discovery API · upstream</text>
  <text x="255" y="312" text-anchor="middle" font-size="12" fill="#33415c">Walks an agent that has no task through</text>
  <text x="255" y="330" text-anchor="middle" font-size="12" fill="#33415c">the 6-stage Stoic sequence to find its</text>
  <text x="255" y="348" text-anchor="middle" font-size="12" fill="#33415c">purpose, then hands off to the engine.</text>

  <!-- hands off arrow -->
  <line x1="415" y1="294" x2="505" y2="294" stroke="#16284d" stroke-width="2.5" marker-end="url(#arrowNavy)"/>
  <text x="460" y="285" text-anchor="middle" font-size="11.5" font-style="italic" fill="#5b6b86">hands off</text>

  <!-- Sage Reasoning box -->
  <rect x="505" y="230" width="320" height="128" rx="10" fill="#eef2f8" stroke="#16284d" stroke-width="2"/>
  <text x="665" y="262" text-anchor="middle" font-size="19" font-weight="bold" fill="#16284d">Sage Reasoning</text>
  <text x="665" y="284" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#9a7d1c">Reasoning-evaluation API · the "substrate" / engine</text>
  <text x="665" y="312" text-anchor="middle" font-size="12" fill="#33415c">Agent submits a decision, action or text;</text>
  <text x="665" y="330" text-anchor="middle" font-size="12" fill="#33415c">returns a Stoic assessment — virtue proximity,</text>
  <text x="665" y="348" text-anchor="middle" font-size="12" fill="#33415c">passion diagnosis, how to improve.</text>

  <!-- ATL bar -->
  <rect x="95" y="408" width="730" height="78" rx="10" fill="#16284d" stroke="#c9a227" stroke-width="2"/>
  <text x="460" y="438" text-anchor="middle" font-size="18" font-weight="bold" fill="#d4af37">Agent Trust Layer (ATL)</text>
  <text x="460" y="460" text-anchor="middle" font-size="12.5" fill="#ffffff">Credentialing + attestation API — issues each agent a credential and certifies its character progression</text>
  <text x="460" y="478" text-anchor="middle" font-size="12" fill="#cdd6e6">a "certificate authority for agents": it controls who gets in, and vouches for them over time</text>

  <!-- ATL up-arrows to the two product boxes -->
  <line x1="255" y1="408" x2="255" y2="360" stroke="#c9a227" stroke-width="2.5" marker-end="url(#arrowGold)"/>
  <line x1="665" y1="408" x2="665" y2="360" stroke="#c9a227" stroke-width="2.5" marker-end="url(#arrowGold)"/>
  <text x="460" y="402" text-anchor="middle" font-size="11.5" font-style="italic" fill="#9a7d1c">credentials &amp; certifies both</text>

  <!-- footer: rule of thumb -->
  <rect x="60" y="520" width="800" height="150" rx="10" fill="#faf7ef" stroke="#c9a227" stroke-width="1.5"/>
  <text x="80" y="550" font-size="15" font-weight="bold" fill="#16284d">The rule of thumb</text>
  <text x="80" y="578" font-size="13" fill="#33415c"><tspan font-weight="bold" fill="#16284d">API</tspan> = what it is.    <tspan font-weight="bold" fill="#16284d">Plugin / skill / MCP server</tspan> = how you deliver it.</text>
  <text x="80" y="600" font-size="13" fill="#33415c"><tspan font-weight="bold" fill="#16284d">Agent</tspan> = who uses it.    <tspan font-weight="bold" fill="#16284d">Wrapper</tspan> = their code that calls it.    <tspan font-weight="bold" fill="#16284d">Substrate</tspan> = the Sage Reasoning engine.</text>
  <line x1="80" y1="614" x2="840" y2="614" stroke="#e3dcc6" stroke-width="1"/>
  <text x="80" y="636" font-size="12.5" fill="#5b6b86">Delivered to agent developers as a <tspan font-weight="bold" fill="#16284d">plugin</tspan> (which can bundle skills + an MCP server).</text>
  <text x="80" y="656" font-size="12.5" fill="#5b6b86">The same Sage Reasoning engine also powers sagereasoning.com for human practitioners.</text>
</svg>
